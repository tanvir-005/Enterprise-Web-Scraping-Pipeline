[project]
name = "enterprise-web-scraping-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Md. Tanvir Ahmed Siddique", email = "tanvir.24633@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "scrapy>=2.19.0",
    "scrapyd>=1.6.0",
    "scrapyd-client>=2.0.3",
]

[project.scripts]
enterprise-web-scraping-pipeline = "enterprise_web_scraping_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[project.entry-points."scrapy"]
settings = "scraper.settings"